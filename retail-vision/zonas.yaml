# Edítalas a mano o dibújalas con:  python definir_zonas.py

linea_entrada:
  p1: [0.5, 0.05]
  p2: [0.5, 0.95]
  invertir_sentido: false   # cámbialo a true si cuenta entradas como salidas

zonas:
